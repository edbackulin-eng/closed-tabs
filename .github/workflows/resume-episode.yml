name: resume-episode

# Finish a full build that ran out of job time after its stills were drawn:
# stills from the Kaggle kernels' outputs, plan and timings from the run's
# artifact, narration and stock re-made (automation/resume_build.py), then the
# render, the package and the upload. No GPU.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: topic slug
        required: true
      run_id:
        description: the cut-off build run (its artifact holds build_full/*.json)
        required: true
      upload:
        description: upload to YouTube
        default: "true"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY_CT: ${{ secrets.GEMINI_API_KEY_CT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Models and music
        run: |
          python automation/fetch_models.py
          python automation/fetch_music.py
      - name: The build's JSON
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n "episode-${{ inputs.run_id }}" -D "$RUNNER_TEMP/ep"
          ls "$RUNNER_TEMP/ep/$SLUG/build_full"
      - name: Stills, narration and stock back in place
        run: python automation/resume_build.py "$SLUG" --jsons "$RUNNER_TEMP/ep/$SLUG/build_full"
      - name: Render and package
        run: python automation/build_episode.py "$SLUG" --skip-stills
      - name: Contact sheet and hook
        if: always()
        run: |
          o="queue/$SLUG/out"
          [ -f "$o/video.mp4" ] || exit 0
          ffmpeg -hide_banner -loglevel error -y -i "$o/video.mp4" \
            -vf "fps=1/15,scale=384:-1,tile=6x9" -frames:v 1 "$o/contact_sheet.jpg"
          end=$(python -c "import json;l=json.load(open('queue/$SLUG/build_full/lines.json'));print(next((x['end'] for x in l if x['end']>=60),65)+0.6)")
          ffmpeg -hide_banner -loglevel error -y -i "$o/video.mp4" -t "$end" -c:v libx264 -preset fast \
            -b:v 12M -maxrate 16M -bufsize 24M -c:a aac -b:a 192k -movflags +faststart "$RUNNER_TEMP/hook_v2.mp4"
      - name: Schedule
        id: run
        if: inputs.upload == 'true'
        run: python automation/daily.py --upload-only "$SLUG"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: resumed-${{ inputs.slug }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/hook_v2.mp4
            queue/${{ inputs.slug }}/out/thumbnail.jpg
            queue/${{ inputs.slug }}/out/contact_sheet.jpg
            queue/${{ inputs.slug }}/out/report.json
            queue/${{ inputs.slug }}/out/metadata.json
            queue/${{ inputs.slug }}/out/credits.json
            queue/${{ inputs.slug }}/out/subs.srt
      - name: Save the state
        if: always() && steps.run.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ topics/queue.json queue/*/out/uploaded.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          cp state/episodes.json "$RUNNER_TEMP/episodes.json"
          git commit -m "State after resume-episode ${{ github.run_id }} (${{ steps.run.outcome }})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; cp "$RUNNER_TEMP/episodes.json" state/episodes.json; git add state/; git commit -m "State after resume-episode ${{ github.run_id }}"; }
            if git push origin HEAD:main; then
              git fetch origin main
              if git show origin/main:state/episodes.json | cmp -s - "$RUNNER_TEMP/episodes.json"; then
                echo "state pushed and verified"; exit 0
              fi
            fi
            sleep $((i * 10))
          done
          echo "::error::the episode state could not be saved"
          exit 1
      - name: Email on failure
        if: failure()
        run: |
          n=$(gh issue list --label run-log --state open --json number --jq '.[0].number // empty')
          [ -z "$n" ] && n=$(gh issue create --title "Daily run failures" --label run-log \
              --body "A comment here mentioning the owner arrives as an email." | grep -o '[0-9]*$')
          gh issue comment "$n" --body "@${{ github.repository_owner }} resume-episode failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
