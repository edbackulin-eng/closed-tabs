name: check-keys

# One call to each link of the LLM chain, from the runner, with the repository's
# own secrets. Run by hand whenever a key is added or rotated.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Call each provider
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY_CT: ${{ secrets.GEMINI_API_KEY_CT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUTF8: 1
        run: python scripts/check_llm.py
