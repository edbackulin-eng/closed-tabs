name: build-hook

# The checkpoint render: the first minute of an episode in full edit, built
# exactly the way a daily video will be. By hand only.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: topic slug with a script in queue/
        required: true
      force_window:
        description: allow Kaggle outside the 20:00-04:00 UTC window
        default: "false"

permissions:
  contents: write

jobs:
  hook:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY_CT: ${{ secrets.GEMINI_API_KEY_CT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Python packages
        run: pip install -q -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Models and music
        run: |
          python automation/fetch_models.py
          python automation/fetch_music.py
      - name: Narrate the hook
        run: python automation/narrate_hook.py "${{ inputs.slug }}" 60
      - name: Plan the edit
        run: python automation/plan_hook.py "${{ inputs.slug }}"
      - name: Stills (Kaggle FLUX, Gemini check)
        run: |
          extra=""
          [ "${{ inputs.force_window }}" = "true" ] && extra="--force-window"
          python automation/stills.py "queue/${{ inputs.slug }}/build/hook_plan.json" --thumbs 8 $extra
      - name: Build the hook
        run: python automation/build_hook.py "${{ inputs.slug }}"
      - name: Thumbnail
        run: python automation/make_thumbnail.py "${{ inputs.slug }}"
      - name: Contact sheet
        if: always()
        run: |
          b="queue/${{ inputs.slug }}/build"
          [ -f "$b/hook.mp4" ] && ffmpeg -hide_banner -loglevel error -y -i "$b/hook.mp4" \
            -vf "fps=1/4,scale=480:-1,tile=4x4" -frames:v 1 "$b/hook_sheet.jpg" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hook-${{ inputs.slug }}
          retention-days: 3
          path: |
            queue/${{ inputs.slug }}/build/hook.mp4
            queue/${{ inputs.slug }}/build/hook_sheet.jpg
            queue/${{ inputs.slug }}/build/*.json
            queue/${{ inputs.slug }}/build/hook_script.txt
            queue/${{ inputs.slug }}/build/stills/*.png
            queue/${{ inputs.slug }}/build/thumbs/*.jpg
            queue/${{ inputs.slug }}/build/thumb_bases/*.png
      - name: Keep the GPU ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/gpu_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "GPU ledger after build-hook ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
