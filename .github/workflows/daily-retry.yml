name: daily-retry

# One more attempt an hour after a failed scheduled daily run. Switched off with
# the schedule: it only reacts to scheduled runs, and there are none yet.
on:
  workflow_run:
    workflows: ["daily"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - run: sleep 3600
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
