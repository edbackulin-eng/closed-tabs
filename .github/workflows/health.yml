name: health

# Once a day: every key the channel runs on is tried for real (scripts/health.py).
# A dead key is emailed at once, one with a known lifetime seven days before it ends.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: 1
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GEMINI_API_KEY_CT: ${{ secrets.GEMINI_API_KEY_CT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -q kaggle && npm install -g @anthropic-ai/claude-code
      - run: python scripts/health.py
      - name: Keep the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/health.json
          git diff --cached --quiet && exit 0
          git commit -m "health: keys checked $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
