name: build-episode

# Builds one full episode without uploading it: the second checkpoint.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: topic slug with a script in queue/
        required: true
      force_window:
        description: allow Kaggle outside the 20:00-04:00 UTC window
        default: "false"

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY_CT: ${{ secrets.GEMINI_API_KEY_CT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Models and music
        run: |
          python automation/fetch_models.py
          python automation/fetch_music.py
      - name: Build
        run: |
          extra=""
          [ "${{ inputs.force_window }}" = "true" ] && extra="--force-window"
          python automation/build_episode.py "${{ inputs.slug }}" $extra
      - name: Contact sheet
        if: always()
        run: |
          o="queue/${{ inputs.slug }}/out"
          [ -f "$o/video.mp4" ] && ffmpeg -hide_banner -loglevel error -y -i "$o/video.mp4" \
            -vf "fps=1/15,scale=384:-1,tile=6x9" -frames:v 1 "$o/contact_sheet.jpg" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: episode-${{ inputs.slug }}
          retention-days: 3
          path: |
            queue/${{ inputs.slug }}/out/*
            queue/${{ inputs.slug }}/build_full/*.json
            queue/${{ inputs.slug }}/build_full/thumbs/*.jpg
      - name: Keep the GPU ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/gpu_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "GPU ledger after build-episode ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
